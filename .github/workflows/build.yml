
name: Compilar MiraPro APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip MiraProAndroid-com-build-na-nuvem.zip -d source
          test -f source/MiraProAndroid/app/build.gradle.kts

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd source/MiraProAndroid
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiraPro-APK
          path: source/MiraProAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
